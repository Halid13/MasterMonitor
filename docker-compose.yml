services:
  mastermonitor:
    image: mastermonitor:latest
    container_name: mastermonitor-instance1
    restart: unless-stopped
    network_mode: host
    user: "0"
    cap_add:
      - NET_RAW
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
