# Nginx Load Balancer for MasterMonitor
# Place this file in /etc/nginx/sites-available/mastermonitor-lb
# Then create a symlink in /etc/nginx/sites-enabled/

upstream mastermonitor_backend {
  least_conn;

  # Instance 1 (remote VM)
  server 192.168.32.154:3000 max_fails=3 fail_timeout=10s;

  # Instance 2 (local app on same VM as Nginx)
  server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;

  keepalive 32;
}

server {
  listen 80;
  server_name _;

  access_log /var/log/nginx/mastermonitor-access.log;
  error_log /var/log/nginx/mastermonitor-error.log;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Keep-alive for SSE endpoints (ex: /api/monitoring/stream)
    proxy_buffering off;
    proxy_read_timeout 3600;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;

    proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
    proxy_next_upstream_tries 3;

    proxy_pass http://mastermonitor_backend;
  }
}
